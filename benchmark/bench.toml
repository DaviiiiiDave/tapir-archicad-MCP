# Benchmark settings shared by every machine. Machine paths live in local.toml (see local.example.toml).

# The dedicated Archicad 29 instance ("Benchmark"). The harness and the proxy refuse every other port.
bench_port = 19725
runs_per_cell = 3
# Kill switch per run, not an expectation. A run that hits it counts as failed.
run_timeout_s = 1800

# Full model IDs; aliases resolve differently between CLI versions.
[models]
haiku = "claude-haiku-5-5"
sonnet = "claude-sonnet-5-5"

# --max-budget-usd per run. Kill switch, not an expectation.
[budgets_usd]
haiku = 2.0
sonnet = 6.0

# A: upstream v0.6.5. B: plan 1 (runtime hygiene), final commit after its review.
[arms.A]
ref = "v0.6.5"
change_log_flag = false

[arms.B]
ref = "d7a8a67"
change_log_flag = true

# Measured on copies of Benchmark.pln (2026-10-20, Task 4 step 4).
# - OpenProject on a saved copy returns without a dialog; the open itself took 27-45 s.
# - New walls and doors get a classification item that is in the fire property's availability,
#   and their fire property starts as userUndefined.
# - Removing the classification makes the property notAvailable.
# - Empty, userUndefined and normal values can be set through the official SetPropertyValuesOfElements.
[oracle.german]
classification_system = "B6636241-937D-234D-902F-2D30E4BD0FB8"
fire_property_group = "Allgemeine Werte"
fire_property_name = "Feuerwiderstandsklasse 13501-2"
not_available_by = "remove_classification"
